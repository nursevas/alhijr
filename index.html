<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al-Hijr — Muslim Women Shop</title>
<meta name="description" content="Al-Hijr — Muslim Women Shop. Бутик в Астане: ул. Мангилик Ел 17А, Коркем-центр.">
<meta name="theme-color" content="#5C3418">
<link rel="icon" type="image/png" href="assets/logo-dark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --milk:#F7F0E6;
    --sand:#E6D3B8;
    --champagne:#EBD9BD;
    --chocolate:#7A4A2A;
    --espresso:#5C3418;
    --ink:#3E2412;
    --serif:"Cormorant Garamond", "Times New Roman", serif;
    --sans:"Manrope", system-ui, -apple-system, sans-serif;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh; min-height:100svh;
    background:var(--milk);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ---------- Background scene ---------- */
  .scene{
    position:fixed; inset:0; z-index:-2;
    background:url("assets/hero.jpg") 62% center/cover no-repeat;
    transform:scale(1.04);
    /* смягчение: меньше мультяшности, спокойные тёплые тона, лёгкий фокус */
    filter:saturate(.62) contrast(.94) brightness(1.03) sepia(.2) blur(1.6px);
    animation:drift 30s ease-in-out infinite alternate;
  }
  /* нарисованный фон отключён; чтобы вернуть его, уберите display:none и background/filter выше */
  .scene svg{display:none;width:100%;height:100%}
  .grain{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    opacity:.16; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .veil{
    position:fixed; inset:0; z-index:-1;
    background:
      linear-gradient(180deg,
        rgba(58,32,15,.62) 0%,
        rgba(78,46,24,.42) 20%,
        rgba(120,80,50,.10) 40%,
        rgba(247,240,230,0) 52%,
        rgba(247,240,230,.55) 72%,
        rgba(247,240,230,.92) 100%);
  }
  @keyframes drift{ from{transform:scale(1.04) translateY(0)} to{transform:scale(1.09) translateY(-1%)} }

  /* ---------- Layout ---------- */
  main{
    width:100%; max-width:560px;
    min-height:100vh; min-height:100svh;
    margin:0 auto;
    padding:clamp(56px,11svh,104px) 20px max(24px,env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    text-align:center;
  }

  /* top: logo + tagline */
  .top{display:flex;flex-direction:column;align-items:center;width:100%}
  .logo{
    width:min(58%, 250px);
    height:auto;
    filter:drop-shadow(0 4px 20px rgba(40,20,8,.40));
    opacity:0; animation:rise 1.2s .1s var(--ease) forwards;
  }
  .eyebrow{
    margin-top:30px;
    display:flex; align-items:center; gap:18px;
    font-size:9.5px; font-weight:500;
    letter-spacing:.46em; text-transform:uppercase;
    color:rgba(255,250,242,.95);
    font-weight:600;
    text-shadow:0 1px 3px rgba(40,20,8,.55), 0 0 16px rgba(40,20,8,.5);
    opacity:0; animation:rise 1.2s .3s var(--ease) forwards;
  }
  .eyebrow::before,.eyebrow::after{
    content:""; width:28px; height:1px; background:rgba(255,250,242,.8);
    box-shadow:0 0 8px rgba(40,20,8,.55);
  }
  .eyebrow span{padding-left:.46em}

  /* bottom: card + signature */
  .bottom{width:100%;display:flex;flex-direction:column;align-items:center}
  .panel{
    width:100%;
    margin-top:36px;
    padding:36px 28px 28px;
    border-radius:28px;
    background:rgba(250,245,237,.8);
    -webkit-backdrop-filter:blur(22px);
    backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.55);
    box-shadow:0 24px 50px -32px rgba(62,36,18,.4);
    display:flex; flex-direction:column; align-items:center;
    opacity:0; animation:rise 1.2s .55s var(--ease) forwards;
  }

  /* ---------- Boutique info ---------- */
  .shop{
    width:100%;
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
    margin-bottom:28px;
  }
  .city{
    font-family:var(--serif);
    font-weight:500;
    font-size:clamp(19px,5vw,22px);
    letter-spacing:.36em;
    padding-left:.36em;
    line-height:1.1;
    color:var(--espresso);
  }
  .city::after{
    content:""; display:block; width:26px; height:1px; margin:14px auto 0;
    background:rgba(122,74,42,.45);
  }
  .addr{
    margin-top:16px;
    display:flex; align-items:center; justify-content:center; gap:7px;
    font-size:clamp(12.5px,3.4vw,13.5px);
    font-weight:400;
    letter-spacing:.02em;
    line-height:1.4;
    color:rgba(62,36,18,.88);
    text-decoration:none;
    transition:color .3s;
  }
  .addr:hover{color:var(--chocolate)}
  .addr svg{width:14px;height:14px;flex:none;color:var(--chocolate)}
  .hours{
    margin-top:8px;
    font-size:12px;
    font-weight:400;
    letter-spacing:.06em;
    color:rgba(92,52,24,.62);
  }

  /* ---------- Button ---------- */
  .actions{width:100%;display:flex;flex-direction:column;gap:10px}
  .btn{
    width:100%;
    display:flex; align-items:center; justify-content:center; gap:11px;
    padding:16px 22px;
    border-radius:999px;
    background:var(--espresso);
    color:#FFF8EE; text-decoration:none;
    font-family:var(--sans); font-weight:500;
    font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    box-shadow:0 10px 22px -16px rgba(62,36,18,.65);
    transition:background .4s var(--ease), transform .45s var(--ease), box-shadow .45s;
  }
  .btn svg{width:18px;height:18px;flex:none}
  .btn span{padding-left:.2em}
  .btn:hover{background:#4A2911;transform:translateY(-2px);box-shadow:0 16px 28px -16px rgba(62,36,18,.7)}
  .btn:active{transform:translateY(0) scale(.99)}
  .btn:focus-visible{outline:2px solid var(--chocolate);outline-offset:3px}

  .love{
    margin-top:28px;
    font-family:var(--serif);
    font-size:clamp(17px,4.6vw,20px);
    font-weight:400;
    color:rgba(92,52,24,.85);
    opacity:0; animation:rise 1.2s .8s var(--ease) forwards;
  }
  .love em{font-style:italic;font-weight:500}

  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  @media (min-width:700px){
    main{padding-top:72px;padding-bottom:40px}
    .panel{padding:32px 28px 26px}
    .logo{width:270px}
  }
  @media (max-width:360px){
    .btn{padding:14px 14px;font-size:10.5px;letter-spacing:.14em}
    .addr{font-size:12px}
  }
  @media (max-height:760px) and (min-width:700px){
    main{padding-top:36px}
    .logo{width:200px}
    .eyebrow{margin-top:18px}
  }
  @media (max-height:700px){
    main{padding-top:36px}
    .logo{width:min(52%,200px)}
    .eyebrow{margin-top:20px}
    .panel{margin-top:22px;padding:20px 16px 16px}
    .shop{margin-bottom:20px}
    .love{margin-top:18px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .logo,.eyebrow,.panel{opacity:1}
  }
</style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#C9A486"/>
          <stop offset=".34" stop-color="#E4C6A2"/>
          <stop offset=".6" stop-color="#F3E0C4"/>
        </linearGradient>
        <radialGradient id="sun" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#FFF6E2" stop-opacity=".95"/>
          <stop offset=".35" stop-color="#FFF0D4" stop-opacity=".5"/>
          <stop offset="1" stop-color="#FFE9C8" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="d1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6C9A3"/><stop offset="1" stop-color="#DDBA90"/></linearGradient>
        <linearGradient id="d2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCB88F"/><stop offset="1" stop-color="#CFA67B"/></linearGradient>
        <linearGradient id="d3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFA67B"/><stop offset="1" stop-color="#BC9066"/></linearGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="1.1"/></filter>
      </defs>

      <rect width="400" height="800" fill="url(#sky)"/>
      <g transform="translate(0 -85)">
      <circle cx="268" cy="395" r="150" fill="url(#sun)"/>

      <!-- distant ridge -->
      <path d="M0 478 L55 452 L112 474 L190 436 L270 470 L340 448 L400 466 V540 H0Z" fill="#BE9A82" opacity=".5" filter="url(#soft)"/>

      <!-- far dune + old town silhouette -->
      <path d="M0 505 C70 482 150 488 230 506 S350 522 400 500 V900 H0Z" fill="url(#d1)"/>
      <g fill="#B58C76" opacity=".78" filter="url(#soft)">
        <!-- minaret -->
        <rect x="296" y="418" width="15" height="92"/>
        <rect x="293" y="412" width="21" height="8"/>
        <path d="M296 412 Q303.500 388 311 412Z"/>
        <rect x="302.800" y="378" width="1.400" height="12"/>
        <!-- low town -->
        <rect x="236" y="478" width="52" height="32"/>
        <path d="M244 478 Q256 458 268 478Z"/>
        <rect x="318" y="486" width="46" height="24"/>
      </g>
      <g fill="#F3E0C4" opacity=".55">
        <path d="M300 438 v10 a3 3 0 0 0 6 0 v-10 a3 3 0 0 0 -6 0z"/>
        <path d="M246 492 v10 h5 v-10 a2.500 2.500 0 0 0 -5 0z"/>
        <path d="M262 492 v10 h5 v-10 a2.500 2.500 0 0 0 -5 0z"/>
        <path d="M328 496 v8 h5 v-8 a2.500 2.500 0 0 0 -5 0z"/>
      </g>

      <!-- mid dune -->
      <path d="M0 566 C90 534 190 552 290 574 S380 570 400 560 V900 H0Z" fill="url(#d2)"/>

      <!-- palms (silhouette) -->
      <g stroke="#8F6A52" fill="none" stroke-linecap="round" opacity=".8">
        <path d="M78 560 C80 530 76 510 82 486" stroke-width="3"/>
        <g transform="translate(82 486)" stroke-width="2.200">
          <path d="M0 0 Q-16 -8 -32 4"/><path d="M0 0 Q-12 -16 -26 -10"/><path d="M0 0 Q0 -18 -4 -26"/>
          <path d="M0 0 Q14 -14 28 -6"/><path d="M0 0 Q18 -4 32 8"/><path d="M0 0 Q-8 6 -20 18"/><path d="M0 0 Q8 6 18 20"/>
        </g>
        <path d="M118 566 C119 548 117 538 121 524" stroke-width="2.200" opacity=".85"/>
        <g transform="translate(121 524)" stroke-width="1.800" opacity=".85">
          <path d="M0 0 Q-12 -6 -23 3"/><path d="M0 0 Q-8 -12 -19 -8"/><path d="M0 0 Q10 -10 20 -4"/><path d="M0 0 Q13 -2 23 7"/><path d="M0 0 Q-5 5 -14 13"/><path d="M0 0 Q5 5 13 14"/>
        </g>
      </g>

      <!-- near dune -->
      <path d="M0 650 C110 612 230 640 400 618 V900 H0Z" fill="url(#d3)"/>
      </g>

      <!-- thin oriental arch frame -->
      <g fill="none" stroke="#FFF1D8" stroke-linecap="round">
        <path d="M34 800 V338 C34 214 112 142 200 70 C288 142 366 214 366 338 V800" stroke-width="1.200" opacity=".42"/>
        <path d="M52 800 V342 C52 228 122 162 200 96 C278 162 348 228 348 342 V800" stroke-width=".8" opacity=".26"/>
        <path d="M200 52 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#FFF1D8" stroke="none" opacity=".4"/>
      </g>
    </svg>
  </div>
  <div class="veil" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main>
    <header class="top">
      <h1 class="visually-hidden">Al-Hijr — Muslim Women Shop</h1>
      <img class="logo" src="assets/logo-light.png" alt="Al-Hijr" width="1890" height="840">
      <p class="eyebrow"><span>Muslim Women Shop</span></p>
    </header>

    <div class="bottom">
    <section class="panel" aria-label="Бутик в Астане">
      <div class="shop">
        <h2 class="city">АСТАНА</h2>
        <a class="addr" href="https://2gis.kz/astana/search/%D0%9C%D0%B0%D0%BD%D0%B3%D0%B8%D0%BB%D0%B8%D0%BA%20%D0%95%D0%BB%2017%D0%90" target="_blank" rel="noopener" aria-label="Открыть адрес на карте">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.400-6.500 11-6.500 11z"/><circle cx="12" cy="10" r="2.300"/></svg>
          <span>ул. Мангилик Ел 17А, Коркем-центр</span>
        </a>
        <p class="hours">ежедневно с 10:00 до 20:00</p>
      </div>

      <div class="actions">
        <a class="btn" id="wa-astana" target="_blank" rel="noopener" aria-label="Написать менеджеру в WhatsApp">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
          </svg>
          <span>Написать на WhatsApp</span>
        </a>
      </div>

    </section>
    <p class="love">с любовью, ваш <em>Al-Hijr</em></p>
    </div>
  </main>

<script>
  // Номер WhatsApp менеджера: только цифры, с кодом страны, без + и пробелов
  const MANAGER_WHATSAPP = "77026064221";
  const GREETING = "Здравствуйте! Пишу с сайта Al-Hijr.";

  document.getElementById("wa-astana").href =
    "https://wa.me/" + MANAGER_WHATSAPP + "?text=" + encodeURIComponent(GREETING);
</script>
</body>
</html>
